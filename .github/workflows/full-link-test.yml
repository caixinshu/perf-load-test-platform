# ============================================================
# 全链路压测验证（Week 3 Day 18）
#
# 1. 启动 5 节点服务
# 2. 用 k6 跑全链路压测脚本（混合场景：60%浏览/25%下单/15%查询）
# 3. 断言错误率 < 5%，且有指标输出
# ============================================================
name: Full-Link Load Test

on:
  push:
    paths:
      - "perf/scripts/scenarios/full-link-load-test.js"
      - "services/**"
      - ".github/workflows/full-link-test.yml"
  workflow_dispatch:

jobs:
  full-link-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & start 5 services
        run: |
          echo "--- 启动 5 节点 ---"
          docker compose -p perf-load-test-platform -f docker-compose.services.yml up -d --build

          echo "--- 等待网关就绪 ---"
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
              echo "gateway ready"
              break
            fi
            sleep 2
          done

          echo "--- 等待 product-service 就绪（通过网关验证 /products/1）---"
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/products/1)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "product-service ready (via gateway), http=$HTTP_CODE"
              break
            fi
            echo "waiting product-service... ($i) http=$HTTP_CODE"
            sleep 2
          done

      - name: Verify gateway reachable from host network
        run: |
          echo "--- 验证网关可从主机网络访问（k6 将用 --network host 走同一通路）---"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          echo "gateway /health -> $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ gateway 不可达"
            docker compose -p perf-load-test-platform -f docker-compose.services.yml ps
            exit 1
          fi
          echo "✅ gateway reachable, k6 将通过 host 网络访问 localhost:8000"

      - name: Run full-link load test
        run: |
          mkdir -p perf/results
          echo "--- 全链路压测（CI 快速版：10 VU / 60s）---"
          # 用 --network host 走主机网络，避免 compose 内部 DNS 在 CI 上偶发不可达
          docker run --rm \
            --user 0:0 \
            --network host \
            -v "$(pwd)/perf/scripts/scenarios/full-link-load-test.js:/test.js" \
            -v "$(pwd)/perf/results:/results" \
            -e GATEWAY_URL=http://localhost:8000 \
            grafana/k6 run /test.js \
            --vus 10 --duration 60s \
            --summary-export /results/full-link-summary.json 2>&1 | tee /tmp/k6-full-link.log

          echo "--- 检查结果 ---"
          python3 - <<'PY'
          import json, sys

          with open("perf/results/full-link-summary.json") as f:
              data = json.load(f)

          metrics = data.get("metrics", {})

          def get_metric_value(metric_name, key):
              """兼容 k6 v0.x (values 包装) 与 v1.x+/v2.x (扁平化) 的 summary 格式"""
              m = metrics.get(metric_name, {})
              if isinstance(m, dict) and "values" in m:
                  return m["values"].get(key, 0)
              return m.get(key, 0) if isinstance(m, dict) else 0

          # 断言 1：有请求发出
          http_reqs = get_metric_value("http_reqs", "count")
          if http_reqs < 10:
              print(f"FAIL: 只有 {http_reqs} 个请求，预期 >= 10")
              sys.exit(1)

          # 断言 2：错误率 < 5%
          failed_metric = metrics.get("http_req_failed", {})
          if isinstance(failed_metric, dict) and "values" in failed_metric:
              failed = failed_metric["values"].get("rate", 0)
          else:
              failed = failed_metric.get("value", 0) if isinstance(failed_metric, dict) else 0
          if failed > 0.05:
              print(f"FAIL: 错误率 {failed:.2%} > 5%")
              sys.exit(1)

          # 断言 3：有响应时间数据
          p95 = get_metric_value("http_req_duration", "p(95)")
          if p95 <= 0:
              print("FAIL: 没有 http_req_duration 数据")
              sys.exit(1)

          print(f"PASS: http_reqs={http_reqs}, failed_rate={failed:.2%}, p95={p95:.1f}ms")
          PY

      - name: Show service logs (for debugging)
        if: failure()
        run: |
          echo "=== api-gateway ==="
          docker compose -p perf-load-test-platform -f docker-compose.services.yml logs api-gateway --tail=30
          echo "=== order-service ==="
          docker compose -p perf-load-test-platform -f docker-compose.services.yml logs order-service --tail=30
          echo "=== product-service ==="
          docker compose -p perf-load-test-platform -f docker-compose.services.yml logs product-service --tail=30

      - name: Cleanup
        if: always()
        run: docker compose -p perf-load-test-platform -f docker-compose.services.yml down -v
