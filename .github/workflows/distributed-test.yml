# ============================================================
# 分布式压测验证（Week 3 Day 16）
# 用 docker-compose.distributed.yml 启动 5 节点被测服务 + 3 个 k6 worker
# 验证分片压测 + 结果聚合全流程
# ============================================================

name: Distributed Load Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'perf/scripts/09-distributed-load-test.js'
      - 'scripts/aggregate_k6_results.py'
      - 'docker-compose.distributed.yml'
      - '.github/workflows/distributed-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'perf/scripts/09-distributed-load-test.js'
      - 'docker-compose.distributed.yml'
  workflow_dispatch:

jobs:
  distributed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build & start system under test (5 nodes)
        run: |
          # 先只启动被测服务，等健康就绪
          docker compose -f docker-compose.distributed.yml up -d --build \
            db cache-service product-service order-service api-gateway

          echo "--- 等待 api-gateway 就绪 ---"
          READY=0
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
              echo "api-gateway ready (after ${i} tries)"
              READY=1
              break
            fi
            echo "waiting... ($i)"
            sleep 3
          done

          if [ "$READY" -ne 1 ]; then
            echo "❌ api-gateway 未能就绪，打印服务日志排查："
            echo "=== docker compose ps ==="
            docker compose -f docker-compose.distributed.yml ps
            echo ""
            echo "=== product-service logs ==="
            docker compose -f docker-compose.distributed.yml logs product-service --tail 50
            echo ""
            echo "=== order-service logs ==="
            docker compose -f docker-compose.distributed.yml logs order-service --tail 50
            echo ""
            echo "=== api-gateway logs ==="
            docker compose -f docker-compose.distributed.yml logs api-gateway --tail 50
            exit 1
          fi

          # 通过网关验证全链路（不直接访问内部服务端口）
          echo "--- 验证商品查询 ---"
          curl -s http://localhost:8000/products/1
          echo ""
          echo "--- 验证下单 ---"
          curl -s -X POST http://localhost:8000/orders \
            -H "Content-Type: application/json" \
            -d '{"product_id":1,"quantity":2}'
          echo ""

      - name: Run distributed load test (3 k6 workers)
        run: |
          echo "--- 启动 3 个 k6 worker 分片压测 ---"
          # 不用 --exit-code-from，因为 worker 退出顺序不同会导致 SIGTERM
          # 压测是否成功由后续的结果文件检查来判断
          docker compose -f docker-compose.distributed.yml up \
            k6-worker-1 k6-worker-2 k6-worker-3 \
            --abort-on-container-exit || true

          echo "--- 确认 3 个 worker 结果文件已生成 ---"
          docker compose -f docker-compose.distributed.yml exec -T k6-worker-1 sh -c 'ls -la /results/' 2>/dev/null || true
          docker create --name k6-check -v perf-load-test-platform_k6-results:/results alpine >/dev/null 2>&1 || \
          docker create --name k6-check -v $(basename $(pwd))_k6-results:/results alpine >/dev/null 2>&1
          docker start k6-check >/dev/null 2>&1 || true
          docker exec k6-check ls -la /results/
          docker rm -f k6-check >/dev/null 2>&1 || true

      - name: Aggregate results from 3 workers
        run: |
          echo "--- 聚合 3 个 worker 的结果 ---"
          # 结果存在 k6-results volume 里，需要拷出来
          docker create --name k6-results-temp \
            -v $(basename $(pwd))_k6-results:/results alpine >/dev/null 2>&1 || \
          docker create --name k6-results-temp \
            -v perf-load-test-platform_k6-results:/results alpine >/dev/null 2>&1

          mkdir -p ./perf/results/distributed
          docker cp k6-results-temp:/results/. ./perf/results/distributed/ 2>/dev/null || true
          docker rm k6-results-temp >/dev/null 2>&1

          ls -la ./perf/results/distributed/

          echo "--- 运行聚合脚本 ---"
          python scripts/aggregate_k6_results.py ./perf/results/distributed

      - name: Verify aggregated results
        run: |
          echo "--- 断言聚合结果关键指标 ---"
          if [ ! -f ./perf/results/distributed/aggregated-summary.json ]; then
            echo "❌ aggregated-summary.json 不存在"
            exit 1
          fi

          python3 - <<'PY'
          import json
          with open('./perf/results/distributed/aggregated-summary.json') as f:
              summary = json.load(f)
          assert 'http_req_duration' in summary, '缺少 http_req_duration 指标'
          assert summary['http_req_duration']['count'] > 0, 'http_req_duration 无数据点'
          d = summary['http_req_duration']
          print("http_req_duration: count=%d, avg=%.2fms, p95=%.2fms, p99=%.2fms" % (
              d['count'], d['avg'], d['p(95)'], d['p(99)']))
          print("✅ 聚合结果验证通过")
          PY

      - name: Upload distributed results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-test-${{ github.run_id }}
          path: perf/results/distributed/

      - name: Show service logs (for debugging)
        if: always()
        run: |
          echo "=== k6-worker-1 logs ==="
          docker compose -f docker-compose.distributed.yml logs k6-worker-1 --tail 20 2>/dev/null || true
          echo ""
          echo "=== k6-worker-2 logs ==="
          docker compose -f docker-compose.distributed.yml logs k6-worker-2 --tail 20 2>/dev/null || true
          echo ""
          echo "=== k6-worker-3 logs ==="
          docker compose -f docker-compose.distributed.yml logs k6-worker-3 --tail 20 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.distributed.yml down -v
