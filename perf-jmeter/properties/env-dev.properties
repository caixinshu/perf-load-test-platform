# ============================================================
# perf-jmeter/properties/env-dev.properties
# 开发环境配置（覆盖 jmeter.properties 和测试计划中的变量）
# ============================================================

# 环境地址（domain 只填主机名，端口单独配置）
baseUrl=localhost
port=8000
protocol=http

# 场景参数
threads=5
ramp_up=10
duration=60

# 阈值
max_p95=500
max_fail_rate=0.01
