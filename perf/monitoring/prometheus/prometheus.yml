# perf/monitoring/prometheus/prometheus.yml
# Prometheus 抓取配置
#
# 数据来源有两条：
#   ① 抓取（scrape）：Prometheus 主动去拉 node_exporter / 自身的 /metrics
#   ② 远程写（remote write）：k6 压测过程中主动把指标推给 Prometheus
#      —— 这条不走 scrape 配置，靠启动参数 --web.enable-remote-write-receiver 打开入口

global:
  scrape_interval: 15s      # 默认抓取间隔
  evaluation_interval: 15s  # 规则评估间隔

scrape_configs:
  # Prometheus 自身（prometheus_* 指标，用来看抓取是否健康）
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # 主机指标（CPU / 内存 / 磁盘 / 网络），容器名就是服务名
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # Pushgateway（Day 9）：k6 压测结束后由 scripts/push_k6_metrics.py 推送的 summary 结果
  # honor_labels: true 必须加——否则 push 时打的 script / run_id / environment
  # 会被 Prometheus 自身的 job / instance 标签覆盖，看板就没法按脚本/批次过滤了。
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  # 被测服务 api（Week 2 Day 8 已埋点：手写中间件暴露 /metrics）
  # 采集应用侧 RED 指标：http_requests_total / http_request_duration_seconds / http_active_requests
  - job_name: demo-api
    metrics_path: /metrics
    scrape_interval: 5s   # 应用指标比主机指标采得密一些，压测时曲线更细腻（也不要太短，见 docs/13 坑 1）
    static_configs:
      - targets: ['api:8000']
